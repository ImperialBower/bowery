# The release (EPIC-20 § Release, 6a): one tag vX.Y.Z publishes three things
# built from one commit, in order, each only if the one before succeeded:
#
#   1. crates.io  bowery (the rlib, for bower)
#   2. npm        @imperialbower/bowery (dist/bowery/: the element, the glue,
#                 the wasm, the licences, MANIFEST.sha256)
#   3. GitHub     bowery-vX.Y.Z.tar.gz, the same files as one flat directory
#
# scripts/dist.sh is the gate: it refuses a tag that is not both Cargo.toml's
# and npm/package.json's version, a README CDN link to another version, and a
# wasm over the Makefile's WASM_GATE.
# Tag a commit whose CI is green. Publishing cannot be undone. If a step
# fails before it published anything, fix the cause outside the repo and
# re-run the failed jobs (`gh run rerun <id> --failed`): the steps that
# succeeded are not run again. A fix inside the repo needs a new patch
# version, since a re-run uses the tag's workflow.
#
# Secrets: none. Both registries use trusted publishing (OIDC): crates.io
# and npmjs.com each trust this repository's release.yml, and the publishing
# job proves it is that workflow with GitHub's OIDC token (id-token: write).
# crates.io: the crate's Settings -> Trusted Publishing names ImperialBower,
# bowery, release.yml; rust-lang/crates-io-auth-action trades the OIDC token
# for a short-lived publish token and revokes it when the job ends.
# npm uses trusted publishing, with no token: npmjs.com trusts this
# repository's release.yml for @imperialbower/bowery, and the npm job proves
# it is that workflow with GitHub's OIDC token (id-token: write). It needs
# npm 11.5.1 or later (Node 24 brings it), and the trusted publisher's
# "Allow npm publish" ticked: without it npm allows only `npm stage publish`
# and refuses this one with "403 OIDC permission denied for this action".
#
# Third-party actions are pinned to commit SHAs, since what this workflow
# builds is published; the crates.io job uses only the Rust project's own
# auth action, and installs Rust with the runner's own rustup. Bump a pin by its tag's commit:
# `git ls-remote https://github.com/<owner>/<action> <ref>`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-22
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - run: cargo test --features wasm
      - run: make pkg
      - name: The release directory (asserts the tag is both versions, the wasm under the gate)
        run: scripts/dist.sh dist/bowery --tag "$TAG"
      - name: Tarball
        run: |
          set -euo pipefail
          tar czf "bowery-$TAG.tar.gz" -C dist/bowery .
          ls -l "bowery-$TAG.tar.gz" dist/bowery
          cat dist/bowery/MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/bowery
            bowery-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  crates:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable, with the runner's rustup
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: A short-lived crates.io token for this workflow (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: npm
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the manifest, then publish (trusted publishing, no token)
        run: |
          set -euo pipefail
          (cd dist/bowery && sha256sum -c MANIFEST.sha256)
          npm --version
          npm publish ./dist/bowery --access public

  github:
    name: GitHub release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifact
      - name: Release with the CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "artifact/bowery-$TAG.tar.gz" --clobber
