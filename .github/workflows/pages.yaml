name: Pages

# Publishes the demo (demo/index.html, assembled into site/ by `make site`)
# to GitHub Pages at https://imperialbower.github.io/bowery/. Only from main,
# and only after the browser proof passes on this build, so a broken demo
# never deploys. The proof's own pages (site/e2e/) are left out.
#
# The repository's Settings -> Pages -> Source must be "GitHub Actions".
#
# Every action is pinned to a commit SHA, as in release.yml: the deploy job
# holds a Pages token. Bump a pin by its tag's commit:
# `git ls-remote https://github.com/<owner>/<action> <ref>`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and prove the demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-22
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
      - run: cd tests/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      # Builds site/ and runs the browser proof against it.
      - run: make e2e
      - run: rm -rf site/e2e
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
