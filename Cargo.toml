[package]
name = "bowery"
version = "0.1.2"
edition = "2024"
rust-version = "1.99.0"
description = "One poker table control, configured not compiled: <bowery-table>."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImperialBower/bowery"
homepage = "https://github.com/ImperialBower/bowery"
documentation = "https://docs.rs/bowery"
readme = "README.md"
keywords = ["poker", "svg", "wasm", "hand-history", "web-component"]
categories = ["games", "wasm", "visualization"]
# The crate is the kernel and its tests; the element, the demo and the
# browser proof ship on npm and in the release tarball.
exclude = ["/.github", "/.okf", "/demo", "/js", "/npm", "/scripts", "/tests/e2e", "/docs", "/bin", "/AI-BOM.md", "/BACKLOG.md", "/CLAUDE.md"]

[lib]
# rlib for bower and native use; cdylib for the browser build.
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The browser element: `element` (its logic, plain Rust) and `wasm` (the
# wasm-bindgen surface). Off by default, so the rlib bower links has no
# wasm-bindgen in its tree.
wasm = ["dep:wasm-bindgen", "dep:serde_json"]

[dependencies]
# The set pkcore's `make check-wasm` builds: no hup-charts (15.8 MB), no
# rayon, no entropy. `equity` stays on so the bots play at full strength.
pkcore = { version = "0.17.3", default-features = false, features = ["hand-histories", "bot-profiles", "equity"] }
serde = { version = "1.0", features = ["derive"] }
# pkcore's YAML crate, so a config and its inline `hand:` parse the same way.
serde_yaml_bw = "2.5"
uuid = { version = "1.22", default-features = false }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
serde_json = { version = "1.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"

# The browser build's size profile (EPIC-20 § Release); wasm-pack then runs
# `wasm-opt -Oz`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
