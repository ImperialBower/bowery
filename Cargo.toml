[package]
name = "bowery"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "One poker table control, configured not compiled: <bowery-table>."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImperialBower/bowery"
readme = "README.md"

[features]
default = []
# The browser element (EPIC-20 Phase 4). Empty until then; CI already builds
# it for wasm32-unknown-unknown.
wasm = []

[dependencies]
# The set pkcore's `make check-wasm` builds: no hup-charts (15.8 MB), no
# rayon, no entropy. `equity` stays on so the bots play at full strength.
pkcore = { version = "0.17.3", default-features = false, features = ["hand-histories", "bot-profiles", "equity"] }
serde = { version = "1.0", features = ["derive"] }
# pkcore's YAML crate, so a config and its inline `hand:` parse the same way.
serde_yaml_bw = "2.5"
uuid = { version = "1.22", default-features = false }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
